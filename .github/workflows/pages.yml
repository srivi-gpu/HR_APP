name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Preview: Actions tab > Deploy to GitHub Pages > Run workflow > pick any branch.
  # Note: Pages has one site, so a preview replaces the live site until main redeploys.
  workflow_dispatch:

# Needed so the workflow can enable Pages and publish to it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the prototype
        uses: actions/checkout@v4

      # enablement: true turns Pages on for this repository if it is still off,
      # so no manual settings change is needed for the first deploy.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Every script and stylesheet is referenced by a bare path, so a browser that has
      # already loaded the site serves the previous app from cache and a deploy looks
      # like it did nothing. Stamping the commit onto each local asset URL gives every
      # deploy fresh URLs. Done here rather than in the source so the checked-in files
      # stay clean; external URLs (the React CDN) are left alone.
      - name: Stamp local assets with the commit
        run: |
          V="$(git rev-parse --short HEAD)"
          echo "Cache-busting assets with ?v=$V"
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -print0 \
            | xargs -0 --no-run-if-empty sed -i -E \
              's#(src|href)="((js|css|design-system)/[^"?]+)"#\1="\2?v='"$V"'"#g'
          # @import inside the design system's index.css is a second hop the stamp above
          # cannot reach, so the imported sheets are stamped where they are named.
          find design-system/css -name '*.css' -print0 \
            | xargs -0 --no-run-if-empty sed -i -E \
              "s#@import url\('([^')?]+)'\)#@import url('\1?v=$V')#g"
          grep -m3 -n 'v=' index.html || true

      # The prototype is already static: the repository root is the site.
      # The action excludes .git and .github from the artifact.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
