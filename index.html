<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aptagrim HRMS</title>
<meta name="description" content="HRMS platform prototype — Admin, HR and Employee workspaces.">
<link rel="stylesheet" href="design-system/css/index.css">
<link rel="stylesheet" href="css/prototype.css">
<style>
/* Unlayered, and on purpose. Every stylesheet above sits inside a cascade layer, and
   an unlayered rule from whatever page frame this prototype is embedded in beats all
   of them however specific they are. So text that merely inherited its type from the
   body came out in the host's typeface while anything with a rule of its own stayed
   Google Sans — two fonts on one page. `html body` outranks the plain `body` such a
   frame writes, whichever of the two loads last, and the form controls are named
   because they do not inherit type at all. */
html body,
html body button, html body input, html body select, html body textarea, html body optgroup {
  font-family: var(--font-sans);
}
</style>
</head>
<body>
<div id="root"></div>

<!-- React via UMD, so the prototype opens straight from the file system with no build step. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<!-- Design system -->
<script src="design-system/js/violet.js"></script>
<script src="design-system/js/icons.js"></script>
<script src="js/brand-logos.js"></script>

<!-- Application. Load order matters: data, then state, then IA, then views. -->
<script src="js/data/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/rules.js"></script>
<script src="js/actions.js"></script>
<script src="js/permissions.js"></script>

<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/perf.js"></script>
<script src="js/payroll.js"></script>
<script src="js/shell.js"></script>

<!-- Screens, one file per phase of PRD section 18. Each registers into HRMS.screens. -->
<script src="js/screens.js"></script>
<script src="vendor/amcharts5.js"></script>
<script src="vendor/apextree.js"></script>
<script src="js/screens/admin-dash-b.js"></script>
<script src="js/screens/asset-request.js"></script>
<script src="js/screens/dashboard.js"></script>

<script src="js/screens/time.js"></script>

<script src="js/app.js"></script>
</body>
</html>
